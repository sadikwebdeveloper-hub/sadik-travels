services:
  - type: web
    name: sadik-travels
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: true
      - key: SQLITE_PATH
        value: /var/data/sadik.sqlite
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: lax
      - key: DEV_OTP_ECHO
        value: false
    disk:
      name: sadik-travels-data
      mountPath: /var/data
      sizeGB: 1
