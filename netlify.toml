[build]
  publish = "."

# Replace YOUR-VERCEL-BACKEND with the actual Vercel project hostname.
# The proxy keeps browser requests same-origin so HttpOnly cookies work without
# SameSite=None or cross-domain cookie hacks.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-VERCEL-BACKEND.vercel.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
